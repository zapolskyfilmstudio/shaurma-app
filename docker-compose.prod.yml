# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  backend:
    ports: !reset []
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/Dockerfile.nginx
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_BEARER_TOKEN: ${VITE_BEARER_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF_MOUNT:-./infra/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro}
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command: "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"

volumes:
  certbot_www:
  certbot_certs:
