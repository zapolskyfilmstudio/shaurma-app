server_names_hash_bucket_size 128;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Catch-all: do not serve shawerma apps on unknown domains.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/megashawerma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/megashawerma/privkey.pem;
    return 444;
}

# Placeholder for internetmuseum.ru — not the kitchen app.
server {
    listen 80;
    listen [::]:80;
    server_name
        xn--e1aaahcksfb3aueo.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        charset utf-8;
        return 200 "Домен зарезервирован. Сайт скоро будет доступен.\n";
    }
}

# HTTP: kitchen (works before kitchen subdomain has SSL)
server {
    listen 80;
    listen [::]:80;
    server_name
        xn--80aai8a.xn--e1atebk.xn--80ad9adi.xn--80aaahcle4cg3byf.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# HTTP: client domain → redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name
        xn--80aaahcle4cg3byf.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: client website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name
        xn--80aaahcle4cg3byf.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/megashawerma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/megashawerma/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/client;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
